[project]
name = "letopis"
version = "0.1.0"
description = "Летопись — движок архива и умного поиска по истории Telegram-чатов"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru",
    "python-dotenv>=1.0",
    "telethon>=1.36",
    "textual>=1.0",
    "tomli; python_version < '3.11'",
]

[project.scripts]
tg = "tgarchive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgarchive"]
